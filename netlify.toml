[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Existing files and Netlify Functions take precedence over this fallback.
# Only / is a public page; sections and language switching do not create routes.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
